name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package/release version to publish to npm, without the leading v'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  parity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Compile check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-features --locked
      - name: TUI snapshot parity
        run: cargo test -p ghosty-tui-core --test snapshot --locked
      - name: Protocol schema parity
        run: cargo test -p ghosty-protocol --test parity_protocol --locked
      - name: State persistence parity
        run: cargo test -p ghosty-state --test parity_state --locked
      - name: Lockfile drift guard
        run: git diff --exit-code -- Cargo.lock

  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release source
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              sha="$(git rev-list -n 1 "${tag}")"
              source_ref="${tag}"
            else
              # Tag doesn't exist yet — build from HEAD
              sha="${GITHUB_SHA}"
              source_ref="${GITHUB_SHA}"
              echo "Tag ${tag} not found; building from ${source_ref} @ ${sha}"
            fi
          else
            tag="${GITHUB_REF_NAME}"
            sha="${GITHUB_SHA}"
            source_ref="${GITHUB_REF_NAME}"
          fi

          if [ -z "${sha}" ]; then
            echo "Unable to resolve release source for ${tag}" >&2
            exit 1
          fi

          # Version policy: stay on 0.0.x — only the patch (3rd) segment may
          # change. Reject any bump to the major/minor segments so releases
          # never roll past 0.0.x by accident.
          if ! printf '%s' "${tag}" | grep -Eq '^v0\.0\.[0-9]+$'; then
            echo "Release tag '${tag}' violates the 0.0.x policy: only the patch segment may change (expected v0.0.<patch>)." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build:
    needs: [parity, resolve]
    # `parity` is gated to tag-push events. On manual `workflow_dispatch`,
    # parity is skipped, so let `build` proceed when parity either succeeded
    # or was skipped — but never when it actually failed or the run was
    # cancelled. Operators using dispatch are expected to have already run
    # the same gates locally / via ci.yml on `main`.
    if: ${{ !cancelled() && (needs.parity.result == 'success' || needs.parity.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- ghosty (cli dispatcher, canonical) ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ghosty
            artifact_name: ghosty-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: ghosty
            artifact_name: ghosty-linux-arm64
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            binary: ghosty
            artifact_name: ghosty-linux-riscv64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ghosty
            artifact_name: ghosty-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: ghosty
            artifact_name: ghosty-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ghosty.exe
            artifact_name: ghosty-windows-x64.exe
          # --- ghosty-tui (TUI runtime, canonical) ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ghosty-tui
            artifact_name: ghosty-tui-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: ghosty-tui
            artifact_name: ghosty-tui-linux-arm64
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            binary: ghosty-tui
            artifact_name: ghosty-tui-linux-riscv64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ghosty-tui
            artifact_name: ghosty-tui-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: ghosty-tui
            artifact_name: ghosty-tui-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ghosty-tui.exe
            artifact_name: ghosty-tui-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install RISC-V cross-compilation toolchain
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          # Install cross-compiler (available in standard repos)
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

          # Add Ubuntu ports for riscv64 packages
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/riscv64.sources <<SRC
          Types: deb
          URIs: http://ports.ubuntu.com/
          Suites: ${UBUNTU_CODENAME} ${UBUNTU_CODENAME}-updates
          Components: main universe
          Architectures: riscv64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          sudo dpkg --add-architecture riscv64
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/riscv64.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y libdbus-1-dev:riscv64
      - name: Install AArch64 cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux'
        run: |
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/arm64.sources <<SRC
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${UBUNTU_CODENAME} ${UBUNTU_CODENAME}-updates ${UBUNTU_CODENAME}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          sudo dpkg --add-architecture arm64
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/arm64.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross libdbus-1-dev:arm64 pkg-config
      - name: Build
        shell: bash
        env:
          DEEPSEEK_BUILD_SHA: ${{ needs.resolve.outputs.sha }}
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR_riscv64gc_unknown_linux_gnu: /usr/lib/riscv64-linux-gnu/pkgconfig
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "${BIN_PATH}" ]; then
            echo "Binary not at ${BIN_PATH}; searching target/ for ${{ matrix.binary }}:"
            find target -name "${{ matrix.binary }}" -type f
            exit 1
          fi
          cp "${BIN_PATH}" "${{ matrix.artifact_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  bundle:
    needs: [build, resolve]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'ghosty*'
      - name: Create platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles/checksums
          MANIFEST="bundles/checksums/ghosty-bundles-sha256.txt"
          : > "$MANIFEST"

          bundle() {
            local platform="$1"   # linux-x64, linux-arm64, macos-x64, macos-arm64, windows-x64
            local cli_src="$2"    # artifact name for ghosty binary
            local tui_src="$3"    # artifact name for ghosty-tui binary
            local ext="$4"        # tar.gz or zip
            local variant="$5"    # '' (standard) or 'portable' (Windows only, no install script)
            shift 5

            local dir="bundles/ghosty-${platform}${variant:+-}${variant}"
            mkdir -p "$dir"

            # Copy binaries, stripping platform suffixes
            local cli_dst="ghosty"
            local tui_dst="ghosty-tui"
            if [[ "$platform" == windows-* ]]; then
              cli_dst="ghosty.exe"
              tui_dst="ghosty-tui.exe"
            fi
            cp "artifacts/${cli_src}/${cli_src}" "$dir/${cli_dst}"
            cp "artifacts/${tui_src}/${tui_src}" "$dir/${tui_dst}"

            # Add install script (standard variant only)
            if [[ "$variant" != "portable" ]]; then
              if [[ "$platform" == windows-* ]]; then
                cp scripts/release/install.bat "$dir/"
                # Convert line endings to CRLF for Windows
                sed -i 's/$/\r/' "$dir/install.bat" 2>/dev/null || true
              else
                cp scripts/release/install.sh "$dir/"
                chmod +x "$dir/install.sh"
              fi
            fi

            if [[ "$ext" == "zip" ]]; then
              (cd bundles && zip -r "ghosty-${platform}${variant:+-}${variant}.zip" "ghosty-${platform}${variant:+-}${variant}/")
            else
              tar -czf "bundles/ghosty-${platform}${variant:+-}${variant}.tar.gz" -C bundles "ghosty-${platform}${variant:+-}${variant}/"
            fi

            local archive="ghosty-${platform}${variant:+-}${variant}.${ext}"
            sha256sum "bundles/${archive}" | awk '{printf "%s  %s\n", $1, $2}' >> "$MANIFEST"
            echo "  Created bundles/${archive}"
          }

          # Platform: linux-x64
          bundle linux-x64 \
            ghosty-linux-x64 ghosty-tui-linux-x64 tar.gz ""

          # Platform: linux-arm64
          bundle linux-arm64 \
            ghosty-linux-arm64 ghosty-tui-linux-arm64 tar.gz ""

          # Platform: linux-riscv64
          bundle linux-riscv64 \
            ghosty-linux-riscv64 ghosty-tui-linux-riscv64 tar.gz ""

          # Platform: macos-x64
          bundle macos-x64 \
            ghosty-macos-x64 ghosty-tui-macos-x64 tar.gz ""

          # Platform: macos-arm64
          bundle macos-arm64 \
            ghosty-macos-arm64 ghosty-tui-macos-arm64 tar.gz ""

          # Platform: windows-x64 (standard + portable)
          bundle windows-x64 \
            ghosty-windows-x64.exe ghosty-tui-windows-x64.exe zip ""
          bundle windows-x64 \
            ghosty-windows-x64.exe ghosty-tui-windows-x64.exe zip "portable"

          echo ""
          echo "=== Archive checksums ==="
          cat "$MANIFEST"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghosty-bundles
          path: bundles/*
          if-no-files-found: error

  windows-installer:
    needs: [build, resolve]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'ghosty*-windows-x64.exe'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.resolve.outputs.tag }}".TrimStart("v")
          Copy-Item "artifacts\ghosty-windows-x64.exe\ghosty-windows-x64.exe" "scripts\installer\ghosty.exe"
          Copy-Item "artifacts\ghosty-tui-windows-x64.exe\ghosty-tui-windows-x64.exe" "scripts\installer\ghosty-tui.exe"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            $makensis = "${env:ProgramFiles}\NSIS\makensis.exe"
          }
          if (!(Test-Path $makensis)) {
            throw "makensis.exe not found after NSIS install"
          }
          Push-Location scripts\installer
          & $makensis "/DVERSION=$version" "ghosty.nsi"
          Pop-Location
          if (!(Test-Path "scripts\installer\GhostyCodeSetup.exe")) {
            throw "GhostyCodeSetup.exe was not produced"
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostyCodeSetup.exe
          path: scripts/installer/GhostyCodeSetup.exe
          if-no-files-found: error

  docker:
    needs: [build, resolve]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # The container image is a best-effort artifact. A docker build/push failure
    # must never mark the release run as failed or block npm/Homebrew, which no
    # longer depend on this job.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          path: source
      - name: Checkout release infrastructure
        uses: actions/checkout@v4
        with:
          path: infra
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern=v{{major}},value=${{ needs.resolve.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=v${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # The build record is useful in CI, but it is uploaded as a
          # `.dockerbuild` artifact. The release job intentionally downloads
          # all binary artifacts, so suppress the extra record artifact there.
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: source
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEEPSEEK_BUILD_SHA=${{ needs.resolve.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # `docker` is intentionally NOT a dependency: the npm/binary release must
    # not wait on (or be blocked by) the container-image build. Docker runs in
    # parallel and is allowed to fail without affecting publication.
    needs: [build, bundle, windows-installer, resolve]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.bundle.result == 'success' && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Match both the canonical `ghosty*` artifacts and the legacy
          # `deepseek*` shim artifacts that ship for the transition release.
          pattern: '*'
      - name: Generate Windows npm launcher asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ghosty-windows-launcher
          {
            printf '@echo off\r\n'
            printf 'where wt >nul 2>nul\r\n'
            printf 'set NO_ANIMATIONS=1\r\n'
            printf 'if "%%ERRORLEVEL%%"=="0" (\r\n'
            printf '    wt --title Ghosty Code cmd /k "%%~dp0ghosty-windows-x64.exe"\r\n'
            printf ') else (\r\n'
            printf '    "%%~dp0ghosty-windows-x64.exe"\r\n'
            printf ')\r\n'
            printf '\r\n'
          } > artifacts/ghosty-windows-launcher/ghosty.bat
      - name: List artifacts
        run: find artifacts -type f
      - name: Generate checksum manifest
        shell: bash
        run: |
          mkdir -p artifacts/checksums
          # Canonical manifest used by ghosty's `ghosty update` flow.
          manifest="artifacts/checksums/ghosty-artifacts-sha256.txt"
          : > "${manifest}"
          while IFS= read -r -d '' file; do
            hash="$(sha256sum "${file}" | awk '{print $1}')"
            base="$(basename "${file}")"
            printf '%s  %s\n' "${hash}" "${base}" >> "${manifest}"
          done < <(find artifacts -type f ! -path 'artifacts/checksums/*' -print0 | sort -z)
          # Legacy alias manifest so v0.8.40 `deepseek update` clients can
          # still find a manifest by their hardcoded name. Same content; will
          # be removed once the legacy shim binaries are retired in v0.9.0.
          cp "${manifest}" "artifacts/checksums/deepseek-artifacts-sha256.txt"
          cat "${manifest}"
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: artifacts/*/*
          prerelease: false
          body: |
            > This release renames the project to **Ghosty Code**. The legacy
            > `deepseek` and `deepseek-tui` binaries continue to ship as
            > compatibility-only deprecation shims during v0.8.x; they print a
            > one-line warning and forward to `ghosty` / `ghosty-tui`.
            > They will be removed in v0.9.0. The legacy npm package
            > `deepseek-tui` is deprecated and receives no further releases.
            > See `docs/REBRAND.md` for the full migration story.

            ## Install

            ### Recommended — npm (one command, both binaries)

            ```bash
            npm install -g ghosty
            ```

            The wrapper downloads both binaries from this Release and places them in the same directory.

            ### Docker / GHCR

            ```bash
            docker run --rm -it \
              -e DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
              -v ~/.deepseek:/home/ghosty/.deepseek \
              ghcr.io/hmbown/ghosty:${{ needs.resolve.outputs.tag }}
            ```

            The image ships the `ghosty` dispatcher and `ghosty-tui` runtime (plus the legacy `deepseek` / `deepseek-tui` shims during the transition). The `latest` tag is also updated on release.

            ### Cargo (Linux / macOS)

            ```bash
            cargo install ghosty-cli ghosty-tui --locked
            ```

            Both crates are required — `ghosty-cli` produces the `ghosty` dispatcher and `ghosty-tui` produces the interactive runtime that the dispatcher delegates to. Installing only one binary will fail at runtime with a `MISSING_COMPANION_BINARY` error.

            ### Manual download — platform archives (recommended)

            Each archive below contains **both** the `ghosty` dispatcher and `ghosty-tui` runtime, plus an install script:

            | Platform | Archive | Install script |
            |---|---|---|
            | Linux x64 | `ghosty-linux-x64.tar.gz` | `install.sh` |
            | Linux ARM64 | `ghosty-linux-arm64.tar.gz` | `install.sh` |
            | Linux RISC-V | `ghosty-linux-riscv64.tar.gz` | `install.sh` |
            | macOS x64 | `ghosty-macos-x64.tar.gz` | `install.sh` |
            | macOS ARM | `ghosty-macos-arm64.tar.gz` | `install.sh` |
            | Windows x64 (installer) | `GhostyCodeSetup.exe` | NSIS setup |
            | Windows x64 | `ghosty-windows-x64.zip` | `install.bat` |
            | Windows x64 (portable) | `ghosty-windows-x64-portable.zip` | — |

            **Unix (Linux / macOS):**
            ```bash
            tar xzf ghosty-<platform>.tar.gz
            cd ghosty-<platform>
            ./install.sh
            ```

            **Windows:**
            - For the installer path, run `GhostyCodeSetup.exe`; it installs both binaries under `%LOCALAPPDATA%\Programs\Ghosty Code\bin` and adds that directory to the current-user PATH.
            - Extract `ghosty-windows-x64.zip`
            - Run `install.bat` (copies to `%USERPROFILE%\bin`)
            - Add `%USERPROFILE%\bin` to your PATH

            The **portable** Windows archive skips the install script — extract and run from any directory. The NSIS installer is currently unsigned and may trigger Windows SmartScreen until a signing certificate is wired into the release pipeline.

            Individual binaries are also attached below for scripting and the npm wrapper. Legacy `deepseek-*` and `deepseek-tui-*` assets are compatibility-only deprecation shims for v0.8.x so that existing `deepseek update` invocations on v0.8.40 keep working; they forward to the canonical binaries. The legacy npm package `deepseek-tui` is deprecated and is not republished.

            ### Verify (recommended)

            Download the checksum manifests from this Release and verify:

            ```bash
            # Linux — archive bundles
            sha256sum -c ghosty-bundles-sha256.txt

            # Linux — individual binaries
            sha256sum -c ghosty-artifacts-sha256.txt

            # macOS
            shasum -a 256 -c ghosty-bundles-sha256.txt
            shasum -a 256 -c ghosty-artifacts-sha256.txt
            ```

            The legacy `deepseek-artifacts-sha256.txt` is also attached for backward compatibility and contains the same hashes as the canonical manifest.

            ## Changelog

            See [CHANGELOG.md](https://github.com/blissito/ghostycode/blob/main/CHANGELOG.md) for the full notes for this release.

  homebrew:
    needs: [release, resolve]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Homebrew tap token
        id: homebrew-token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_PAT || secrets.RELEASE_TAG_PAT }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "No Homebrew tap token configured; skipping tap update."
            echo "available=false" >> "${GITHUB_OUTPUT}"
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi
      # Checkout main (not the tag) so the release-infra script is always
      # available, even for tags created before this workflow was added.
      - uses: actions/checkout@v4
        if: steps.homebrew-token.outputs.available == 'true'
        with:
          ref: main
      - name: Download checksum manifest
        if: steps.homebrew-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ needs.resolve.outputs.tag }} \
            --repo ${{ github.repository }} \
            --pattern 'deepseek-artifacts-sha256.txt' \
            --dir /tmp
      - name: Update Homebrew tap
        if: steps.homebrew-token.outputs.available == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          MANIFEST: /tmp/deepseek-artifacts-sha256.txt
          TAP_REPO: blissito/homebrew-ghosty
          TOKEN: ${{ secrets.HOMEBREW_TAP_PAT || secrets.RELEASE_TAG_PAT }}
        run: bash .github/scripts/update-homebrew-tap.sh

# npm publish is intentionally not automated — no automation token is
# provisioned in CI. Release the npm wrapper manually from a developer
# machine after the GitHub Release has been created:
#
#   cd npm/ghostycode && npm publish
#
# The `prepublishOnly` hook verifies the GitHub Release assets first. If the
# npm account has 2FA enforced for writes, add `--otp=<code>` to the command
# (the interactive prompt does not work in non-interactive shells).
