[package]
name = "ghosty-app-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "App-server transport for Ghosty runtime integrations"
# `ghosty app-server` is owned by ghosty-cli; this crate is library-only.
autobins = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
ghosty-agent = { path = "../agent", version = "0.0.19" }
ghosty-config = { path = "../config", version = "0.0.19" }
ghosty-core = { path = "../core", version = "0.0.19" }
ghosty-execpolicy = { path = "../execpolicy", version = "0.0.19" }
ghosty-hooks = { path = "../hooks", version = "0.0.19" }
ghosty-mcp = { path = "../mcp", version = "0.0.19" }
ghosty-protocol = { path = "../protocol", version = "0.0.19" }
ghosty-release = { path = "../release", version = "0.0.19" }
ghosty-state = { path = "../state", version = "0.0.19" }
ghosty-tools = { path = "../tools", version = "0.0.19" }
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = "0.5"
