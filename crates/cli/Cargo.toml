[package]
name = "ghosty-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic terminal facade for open-source and open-weight coding models"

[lints]
workspace = true

[[bin]]
name = "ghosty"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
ghosty-tui = { path = "../tui", version = "0.0.19" }
ghosty-agent = { path = "../agent", version = "0.0.19" }
ghosty-app-server = { path = "../app-server", version = "0.0.19" }
ghosty-config = { path = "../config", version = "0.0.19" }
ghosty-lane = { path = "../lane", version = "0.0.19" }
ghosty-workflow = { path = "../workflow", version = "0.0.19" }
ghosty-execpolicy = { path = "../execpolicy", version = "0.0.19" }
ghosty-mcp = { path = "../mcp", version = "0.0.19" }
ghosty-paths = { path = "../paths", version = "0.0.19" }
ghosty-release = { path = "../release", version = "0.0.19" }
ghosty-secrets = { path = "../secrets", version = "0.0.19" }
ghosty-state = { path = "../state", version = "0.0.19" }
ghosty-telemetry = { path = "../telemetry", version = "0.0.19" }
chrono.workspace = true
console = "0.16.3"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
semver.workspace = true
tokio.workspace = true
mimalloc.workspace = true
sha2.workspace = true
tempfile.workspace = true
tracing.workspace = true
webbrowser = "1.0"
zeroize = "1.8.2"

[build-dependencies]
ghosty-build-support = { path = "../build-support", version = "0.0.19" }

# Parent-death cleanup for delegated server children (#3259): on Linux the
# dispatcher sets PR_SET_PDEATHSIG so the child is signalled if the dispatcher
# dies uncatchably; on Windows it assigns the child to a kill-on-job-close Job
# Object. Also used in main.rs to reset SIGPIPE to SIG_DFL on any Unix target
# (#4030), so libc must be available across all Unix, not just Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
