[package]
name = "ghosty-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core runtime boundaries for Ghosty"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
ghosty-agent = { path = "../agent", version = "0.0.18" }
ghosty-config = { path = "../config", version = "0.0.18" }
ghosty-execpolicy = { path = "../execpolicy", version = "0.0.18" }
ghosty-hooks = { path = "../hooks", version = "0.0.18" }
ghosty-mcp = { path = "../mcp", version = "0.0.18" }
ghosty-protocol = { path = "../protocol", version = "0.0.18" }
ghosty-state = { path = "../state", version = "0.0.18" }
ghosty-tools = { path = "../tools", version = "0.0.18" }
regex = "1.11"
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
