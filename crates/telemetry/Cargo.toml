[package]
name = "ghosty-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anonymous, user-disableable product usage counting for Ghosty"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ghosty-config = { path = "../config", version = "0.0.23" }
ghosty-paths = { path = "../paths", version = "0.0.23" }
ghosty-release = { path = "../release", version = "0.0.23" }
fd-lock = "4.0.4"
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
ghosty-build-support = { path = "../build-support", version = "0.0.23" }

[dev-dependencies]
# Used as an *assertion*, never as a filter: every string leaf of a serialized
# batch is run through `redact_for_disclosure` and must come back unredacted.
ghosty-workflow = { path = "../workflow", version = "0.0.23" }
