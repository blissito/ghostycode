<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020711" />
    <title>Ghosty</title>
    <style>
      /* Paleta CWC Ocean — la misma de runtime_web/styles.css */
      :root {
        color-scheme: dark;
        --bg: #020711;
        --text: #f6f2e8;
        --text-soft: #b6c0d4;
        --action: #6aaef2;
        --accent: {{ACCENT}};
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      main { max-width: 420px; }
      h1 { margin: 0 0 10px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--text-soft); font-size: 15px; }
      .hint {
        margin-top: 22px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{TITLE}}</h1>
      <p>{{MESSAGE}}</p>
      <p class="hint">{{HINT}}</p>
    </main>
  </body>
</html>
