# blissito.GhostyCode — winget singleton manifest for GhostyCode (single binary)
# PackageIdentifier follows the publisher convention used by the Homebrew formula (ghosty).
# Canonical maintenance instructions live in packaging/winget/README.md; the generator mirrors these exact bytes to .winget/.
# Winget installs only `ghosty` + `ghosty-tui`; compatibility release filenames are not installed commands.

PackageIdentifier: blissito.GhostyCode
PackageVersion: 0.9.6
DefaultLocale: en-US
ManifestType: singleton
ManifestVersion: 1.6.0

Publisher: Hmbown
PublisherUrl: https://github.com/Hmbown
PublisherSupportUrl: https://github.com/blissito/ghostycode/issues
PackageName: GhostyCode
PackageUrl: https://github.com/blissito/ghostycode
License: MIT
LicenseUrl: https://github.com/blissito/ghostycode/blob/main/LICENSE
Copyright: Copyright (c) Hmbown
ShortDescription: Terminal coding agent for supported hosted and local models
Description: |
  GhostyCode is a terminal coding agent that runs on your machine. The v0.9.5+ single-binary
  release ships one `ghosty` binary per target (plus the `ghosty-tui` shim) across Linux x64 (musl),
  Linux arm64, Android arm64, macOS x64/arm64, and Windows x64/arm64. See https://github.com/blissito/ghostycode
  for provider setup, Fleet workflows, and the full install guide (docs/INSTALL.md).
Author: Hmbown
Moniker: ghosty
Tags:
  - ghosty
  - deepseek
  - cli
  - tui
  - terminal
  - ai
  - coding-agent
  - rust
MinimumOSVersion: 10.0.0.0
ReleaseNotes: https://github.com/blissito/ghostycode/releases/tag/v0.9.6
ReleaseNotesUrl: https://github.com/blissito/ghostycode/releases/tag/v0.9.6
InstallationNotes: |
  The winget package installs the Windows binaries. For the NSIS installer (GhostyCodeSetup.exe)
  the installer adds %LOCALAPPDATA%\Programs\GhostyCode\bin to the user PATH. For the portable
  ZIP, winget extracts ghosty.exe and ghosty-tui.exe side-by-side and adds the install location to PATH.
  Verify checksums with ghosty-artifacts-sha256.txt from the same GitHub Release.
Documentations:
  - DocumentLabel: Install guide
    DocumentUrl: https://github.com/blissito/ghostycode/blob/main/docs/INSTALL.md
  - DocumentLabel: Releases
    DocumentUrl: https://github.com/blissito/ghostycode/releases

Installers:
  # Preferred: NSIS installer for Windows x64 (per-user, no elevation, adds user PATH).
  - Architecture: x64
    InstallerType: nullsoft
    Scope: user
    InstallerUrl: https://github.com/blissito/ghostycode/releases/download/v0.9.6/GhostyCodeSetup.exe
    InstallerSha256: 040afa01a70ddae4ea7783e563bacd962a512b4d288ee5c5c5111ef2760755a7
    ProductCode: GhostyCode
    UpgradeBehavior: install
    FileExtensions:
      - toml
    ReleaseDate: 2026-08-12
  # Portable ZIP fallback — same single binary (ghosty.exe + ghosty-tui.exe). Used when NSIS is blocked
  # by policy or for winget's portable install flow. NestedInstallerType is portable (no installer).
  - Architecture: x64
    InstallerType: zip
    Scope: user
    InstallerUrl: https://github.com/blissito/ghostycode/releases/download/v0.9.6/ghosty-windows-x64.zip
    InstallerSha256: a3e0ed9b5810904ca4f0d76074aca749dfd13b71126de17bb12357d3506587b1
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: ghosty-windows-x64/ghosty.exe
        PortableCommandAlias: ghosty
      - RelativeFilePath: ghosty-windows-x64/ghosty-tui.exe
        PortableCommandAlias: ghosty-tui
    ReleaseDate: 2026-08-12
  - Architecture: x64
    InstallerType: zip
    Scope: user
    InstallerUrl: https://github.com/blissito/ghostycode/releases/download/v0.9.6/ghosty-windows-x64-portable.zip
    InstallerSha256: f803fba6f174ccd710e81b4e986daedcbe7a62fda0744f8c64342aa7751d1206
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: ghosty-windows-x64-portable/ghosty.exe
        PortableCommandAlias: ghosty
      - RelativeFilePath: ghosty-windows-x64-portable/ghosty-tui.exe
        PortableCommandAlias: ghosty-tui
    ReleaseDate: 2026-08-12
  - Architecture: arm64
    InstallerType: zip
    Scope: user
    InstallerUrl: https://github.com/blissito/ghostycode/releases/download/v0.9.6/ghosty-windows-arm64.zip
    InstallerSha256: c1ed644838550922c563fca7b00646482d3a3bb781aa92affc9059d14ca6d942
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: ghosty-windows-arm64/ghosty.exe
        PortableCommandAlias: ghosty
      - RelativeFilePath: ghosty-windows-arm64/ghosty-tui.exe
        PortableCommandAlias: ghosty-tui
    ReleaseDate: 2026-08-12
  - Architecture: arm64
    InstallerType: zip
    Scope: user
